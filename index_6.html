<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #FFD5D2; }
:root {
  --bg: #FFD5D2; --surface: #FFFFFF; --surface-2: #FFF0EE; --ink: #3A2226; --ink-soft: #8F5B66;
  --berry: #AF707B; --berry-dark: #824C48; --sage: #7A9B7E; --gold: #C9967B; --border: #F3C9C5; --danger: #B3543F;
}
.ov-root {
  background: var(--bg); color: var(--ink); font-family: 'Work Sans', sans-serif; min-height: 100vh; padding: 28px 20px 60px;
}
.ov-auth-screen { display: flex; align-items: center; justify-content: center; }
.ov-auth-card { max-width: 380px; width: 100%; }
.ov-auth-card h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0 0 14px; color: var(--berry-dark); text-align: center; }
.ov-auth-bar { max-width: 900px; margin: 0 auto; display: flex; justify-content: flex-end; gap: 16px; padding: 10px 20px 0; }
.ov-auth-link { background: none; border: none; color: var(--ink-soft); font-size: 12.5px; cursor: pointer; text-decoration: underline; font-family: 'Work Sans', sans-serif; padding: 4px; }
.ov-auth-link:hover { color: var(--berry-dark); }
.ov-auth-overlay { position: fixed; inset: 0; background: rgba(43,38,32,.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.ov-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 300px; color: var(--ink-soft); }
.ov-spin { animation: ov-spin 1s linear infinite; }
@keyframes ov-spin { to { transform: rotate(360deg); } }
.ov-header { max-width: 900px; margin: 0 auto 8px; }
.ov-brand { display: flex; align-items: center; gap: 14px; }
.ov-brand-mark { width: 50px; height: 50px; border-radius: 12px; overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 3px rgba(130,76,72,.25); }
.ov-brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ov-invoice-logo { display: flex; justify-content: center; margin: 0 0 12px; }
.ov-invoice-logo img { width: 96px; height: 96px; object-fit: cover; border-radius: 16px; box-shadow: 0 1px 4px rgba(130,76,72,.25); }
.ov-brand h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; margin: 0; color: var(--berry-dark); }
.ov-brand p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13.5px; }
.ov-stitch { width: 100%; height: 10px; margin-top: 16px; }
.ov-stitch path { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 4 5; stroke-linecap: round; }
.ov-tabs { max-width: 900px; margin: 22px auto 0; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
.ov-tabs button { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border: none; background: none; font-family: 'Work Sans', sans-serif; font-weight: 500; font-size: 14px; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
.ov-tabs button:hover { color: var(--berry-dark); }
.ov-tabs button.active { color: var(--berry-dark); border-bottom-color: var(--berry); }
.ov-main { max-width: 900px; margin: 24px auto 0; }
.ov-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.ov-form-card h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0 0 16px; color: var(--berry-dark); }
.ov-section-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 28px 0 14px; color: var(--berry-dark); }
.ov-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
.ov-field span { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }
.ov-field input, .ov-field select { font-family: 'Work Sans', sans-serif; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font-size: 14px; color: var(--ink); width: 100%; }
.ov-field input:focus, select:focus, .ov-material-row input:focus { outline: 2px solid var(--berry); outline-offset: 1px; }
.ov-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.ov-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ov-label { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; display: block; margin-bottom: 8px; }
.ov-materials { margin-bottom: 14px; }
.ov-material-row { display: grid; grid-template-columns: 2fr 1fr 0.8fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
.ov-material-row input, .ov-material-row select { font-family: 'Work Sans', sans-serif; padding: 8px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font-size: 13.5px; color: var(--ink); width: 100%; }
.ov-material-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.ov-materials-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ov-material-stock-card { padding: 14px 16px; }
.ov-material-stock-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.ov-material-stock-head h3 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; margin: 3px 0 0; color: var(--ink); }
.ov-material-code { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
.ov-barcode-wrap { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 8px 6px 6px; margin: 0 0 10px; text-align: center; }
.ov-barcode-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #1a1a1a; margin-top: 2px; }
.ov-scan-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; flex-wrap: wrap; }
.ov-scan-row .ov-field { flex: 1; min-width: 200px; }
.ov-stock-ok, .ov-stock-low, .ov-stock-out { font-size: 13.5px; font-weight: 600; margin: 4px 0; }
.ov-stock-ok { color: var(--sage); }
.ov-stock-low { color: var(--gold); }
.ov-stock-out { color: var(--danger); }
.ov-material-restock { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.ov-material-card-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.ov-material-card-head input { flex: 1; font-family: 'Work Sans', sans-serif; padding: 8px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font-size: 13.5px; color: var(--ink); }
.ov-material-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.ov-material-grid .ov-field { margin-bottom: 0; }
.ov-material-grid input, .ov-material-grid select { font-family: 'Work Sans', sans-serif; padding: 8px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font-size: 13.5px; color: var(--ink); width: 100%; }
.ov-material-cost-hint { margin-top: 10px; font-size: 12px; color: var(--ink-soft); text-align: right; }
.ov-material-cost-hint strong { font-family: 'IBM Plex Mono', monospace; color: var(--berry-dark); }
.ov-add-row { display: flex; align-items: center; gap: 5px; background: none; border: 1px dashed var(--border); color: var(--berry-dark); border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: 'Work Sans', sans-serif; }
.ov-add-row:hover { background: var(--surface-2); }
.ov-preview { display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin: 14px 0; font-size: 13.5px; }
.ov-preview strong { font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: var(--berry-dark); }
.ov-primary-btn, .ov-secondary-btn { font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 14px; border: none; border-radius: 7px; padding: 11px 18px; cursor: pointer; transition: opacity .15s; }
.ov-primary-btn { background: var(--berry); color: #fff; width: 100%; }
.ov-primary-btn:hover { opacity: .9; }
.ov-secondary-btn { background: var(--sage); color: #fff; white-space: nowrap; }
.ov-secondary-btn:hover { opacity: .9; }
.ov-danger-btn { font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 13px; border: 1px solid var(--danger); border-radius: 7px; padding: 8px 14px; cursor: pointer; background: transparent; color: var(--danger); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s; }
.ov-danger-btn:hover { background: var(--danger); color: #fff; }
.ov-icon-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 6px; border-radius: 5px; display: flex; }
.ov-icon-btn:hover { background: var(--surface-2); color: var(--danger); }
.ov-empty { color: var(--ink-soft); font-size: 14px; display: flex; align-items: center; gap: 6px; padding: 10px 0; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.ov-tag-card { position: relative; padding-top: 26px; }
.ov-corner { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.ov-tag { position: relative; text-align: center; padding: 14px 10px 12px; margin-bottom: 12px; border: 1px dashed var(--gold); border-radius: 8px; background: var(--surface-2); }
.ov-tag-hole { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--gold); }
.ov-tag h3 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; margin: 4px 0 8px; color: var(--ink); }
.ov-tag-cost { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: var(--berry-dark); }
.ov-tag-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.ov-breakdown { list-style: none; margin: 0 0 14px; padding: 0; font-size: 12.5px; }
.ov-breakdown li { display: flex; justify-content: space-between; padding: 4px 0; color: var(--ink-soft); border-bottom: 1px solid var(--border); }
.ov-breakdown li:last-child { border-bottom: none; }
.ov-produce { display: flex; gap: 8px; }
.ov-produce input { width: 70px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font-size: 13.5px; }
.ov-summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.ov-summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 14px 16px; }
.ov-summary-card span { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
.ov-summary-card strong { font-family: 'IBM Plex Mono', monospace; font-size: 18px; display: flex; align-items: center; gap: 5px; }
.ov-good strong { color: var(--sage); }
.ov-bad strong { color: var(--danger); }
.ov-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13.5px; }
.ov-table th { text-align: left; background: var(--surface-2); padding: 10px 12px; font-weight: 600; color: var(--ink-soft); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
.ov-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; }
.ov-table-wrap .ov-table { border-radius: 0; }
.ov-table td { padding: 10px 12px; border-top: 1px solid var(--border); }
.ov-mono { font-family: 'IBM Plex Mono', monospace; }
.ov-good-text { color: var(--sage); }
.ov-bad-text { color: var(--danger); }
.ov-depleted { opacity: .45; }
.ov-note { max-width: 900px; margin: 0 auto 18px; font-size: 12.5px; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; }
.ov-banner { max-width: 900px; margin: 0 auto 16px; font-size: 13.5px; color: var(--berry-dark); background: #F3E4EA; border: 1px solid #E3C4D2; padding: 10px 14px; border-radius: 8px; }
.ov-search-row { display: flex; gap: 10px; margin-bottom: 16px; }
.ov-search-row input { flex: 1; font-family: 'Work Sans', sans-serif; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font-size: 14px; color: var(--ink); }
.ov-invoice-detail { padding: 16px 6px; }
.ov-receipt { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; white-space: pre-wrap; background: var(--surface-2); border-left: 1px dashed var(--gold); border-right: 1px dashed var(--gold); padding: 16px; line-height: 1.55; margin: 0 0 16px; }
.ov-receipt-tear { color: var(--ink-soft); font-size: 10px; letter-spacing: 2px; }
.ov-invoice-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 4px; }
@media print {
  body * { visibility: hidden; }
  .ov-print-area, .ov-print-area * { visibility: visible; }
  .ov-print-area { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; }
  .ov-invoice-actions { display: none; }
}
@media (max-width: 640px) {
  .ov-row-3 { grid-template-columns: 1fr; }
  .ov-materials-list { grid-template-columns: 1fr; }
  .ov-row-2 { grid-template-columns: 1fr; }
  .ov-material-row { grid-template-columns: 1fr 1fr; }
  .ov-brand h1 { font-size: 22px; }
  .ov-produce { flex-wrap: wrap; }
  .ov-secondary-btn, .ov-danger-btn { white-space: normal; }
  .ov-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .ov-tabs button { flex-shrink: 0; }
  .ov-summary-row { grid-template-columns: 1fr 1fr; }
  .ov-receipt { font-size: 11px; padding: 14px 10px; }
}
</style>
